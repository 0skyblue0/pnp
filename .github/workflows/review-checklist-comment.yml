name: Review Checklist Comment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pnp-review-checklist -->";
            const body = `${marker}
            ## AGENTS_MASTER Review Gate

            REV must complete at least 3 convergence rounds before merge candidacy.

            ### REV
            - [ ] Round 1: correctness and design alignment
            - [ ] Round 2: security, performance, errors, boundaries
            - [ ] Round 3: readability, tests, regression, acceptance criteria
            - [ ] Critical = 0
            - [ ] High = 0
            - [ ] Medium <= 2 and tracked
            - [ ] CI lint/typecheck/test/build green

            ### SEC
            - [ ] Required for auth, customer, complaint, LLM, or PII-adjacent changes
            - [ ] Session cookie flags checked
            - [ ] PII storage/response/log leakage checked
            - [ ] CSRF and SQL injection paths checked

            ### QA
            - [ ] Relevant US acceptance criteria verified
            - [ ] Tablet 1024x768 regression considered

            Merge remains a human decision after ARCH sign-off.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
