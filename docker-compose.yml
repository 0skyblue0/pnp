services:
  api:
    build:
      context: .
      dockerfile: docker/node-dev.Dockerfile
    working_dir: /app
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://pnp_admin:pnp_admin@host.docker.internal:5432/pnp?schema=pnp}
      SESSION_SECRET: docker-dev-session-secret-with-at-least-32-chars
      BOOTSTRAP_USERNAME: owner
      BOOTSTRAP_PASSWORD_HASH: $$2a$$12$$dE7HlHWASnJP9txW.Xd1.eaC9mQnxa.u65Xox33aT0/B.33uTqu7a
      CORS_ORIGIN: http://localhost:5173
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-http://host.docker.internal:8642/v1}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_API_MODEL: ${HERMES_API_MODEL:-pnp-response-classifier}
      HERMES_API_TIMEOUT_MS: ${HERMES_API_TIMEOUT_MS:-60000}
    command: >
      sh -c "npm run prisma:generate -w @pnp/api
      && npm run prisma:migrate:deploy -w @pnp/api
      && npm run dev -w @pnp/api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/node-dev.Dockerfile
    working_dir: /app
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:3000
    command: npm run dev -w @pnp/web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5173/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
